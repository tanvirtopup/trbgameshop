<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRB Game Shop - Instant Diamond TopUp</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .header { background: #0f3460; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .card { background: #16213e; border: 1px solid #e94560; border-radius: 10px; padding: 15px; max-width: 400px; margin: 0 auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>TRB Game Shop</h1>
        <p>ইনস্ট্যান্ট ফ্রি ফায়ার ডায়মন্ড টপ-আপ</p>
    </div>
    <div class="card">
        <h3>Free Fire UID TopUp</h3>
        <input type="text" placeholder="আপনার Player UID দিন">
        <br>
        <button>টপ-আপ করুন</button>
    </div>
</body>
</html>
