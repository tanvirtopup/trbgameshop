<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRB Game Shop - Fast Diamond Topup</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding-bottom: 50px; }
        
        /* Navbar */
        .navbar { background: #151d2a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4655; }
        .logo { font-size: 22px; font-weight: bold; color: #ff4655; text-transform: uppercase; letter-spacing: 1px; }
        
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        /* Banner */
        .banner { background: linear-gradient(45deg, #1f293d, #ff4655); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255, 70, 85, 0.3); }
        .banner h2 { font-size: 20px; margin-bottom: 5px; }
        .banner p { font-size: 13px; opacity: 0.9; }

        /* Step Title */
        .step-title { font-size: 16px; margin: 15px 0 10px 0; color: #00d26a; display: flex; align-items: center; gap: 8px; }

        /* Input Box */
        .input-group input { width: 100%; padding: 14px; background: #151d2a; border: 1px solid #2a374e; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #ff4655; }

        /* Package Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #151d2a; border: 1px solid #2a374e; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover, .card.active { border-color: #ff4655; background: #1c2738; transform: translateY(-3px); }
        .card .title { font-size: 14px; font-weight: bold; }
        .card .price { font-size: 13px; color: #ff4655; margin-top: 5px; font-weight: bold; }

        /* Payment Buttons */
        .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pay-card { background: #151d2a; border: 1px solid #2a374e; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; }
        .pay-card.bkash { color: #e2136e; }
        .pay-card.nagad { color: #f7921e; }
        .pay-card.rocket { color: #8c3494; }

        /* Submit Button */
        .btn-submit { width: 100%; background: #ff4655; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 25px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 70, 85, 0.4); }
        .btn-submit:hover { background: #e03e4d; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-gamepad"></i> TRB Game Shop</div>
    </div>

    <div class="container">
        <div class="banner">
            <h2>Free Fire Instant Top-Up</h2>
            <p>১০০% সেফ ও অটোমেটিক ডায়মন্ড ডেলিভারি</p>
        </div>

        <!-- Step 1 -->
        <div class="step-title"><i class="fa-solid fa-1"></i> প্লেয়ার অ্যাকাউন্ট তথ্য</div>
        <div class="input-group">
            <input type="number" placeholder="আপনার Player UID দিন">
        </div>

        <!-- Step 2 -->
        <div class="step-title"><i class="fa-solid fa-2"></i> রিচার্জ প্যাকেজ সিলেক্ট করুন</div>
        <div class="grid">
            <div class="card active">
                <div class="title">💎 115 Diamonds</div>
                <div class="price">80 BDT</div>
            </div>
            <div class="card">
                <div class="title">💎 240 Diamonds</div>
                <div class="price">160 BDT</div>
            </div>
            <div class="card">
                <div class="title">💎 610 Diamonds</div>
                <div class="price">420 BDT</div>
            </div>
            <div class="card">
                <div class="title">💎 Weekly Membership</div>
                <div class="price">170 BDT</div>
            </div>
        </div>

        <!-- Step 3 -->
        <div class="step-title"><i class="fa-solid fa-3"></i> পেমেন্ট মেথড</div>
        <div class="pay-grid">
            <div class="pay-card bkash">bKash</div>
            <div class="pay-card nagad">Nagad</div>
            <div class="pay-card rocket">Rocket</div>
        </div>

        <button class="btn-submit">এখনই অর্ডার করুন</button>
    </div>

</body>
    </html>
