<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRB TOPUP - Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding-bottom: 70px; }

        /* Header Styles */
        header { background: #0056b3; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: bold; }
        .user-balance { background: #003d80; padding: 5px 12px; border-radius: 20px; font-size: 14px; }

        /* Notice Bar */
        .notice { background: #111; color: #fff; font-size: 13px; padding: 8px 12px; display: flex; align-items: center; }
        .notice-tag { background: #007bff; padding: 2px 8px; border-radius: 4px; margin-right: 8px; font-weight: bold; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }

        /* Banner Slider */
        .banner-container { width: 100%; height: 180px; background: #ddd; border-radius: 10px; overflow: hidden; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
        .banner-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Quick Links */
        .quick-links { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .link-box { background: white; width: 31%; text-align: center; padding: 12px 5px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 13px; font-weight: bold; text-decoration: none; color: #333; }

        /* Products Grid */
        .section-title { font-size: 16px; margin-bottom: 10px; color: #333; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card h4 { font-size: 15px; color: #333; margin-bottom: 5px; }
        .product-card p { color: #28a745; font-weight: bold; margin-bottom: 10px; }
        .buy-btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; width: 100%; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
        .nav-item { text-align: center; color: #666; font-size: 12px; text-decoration: none; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">🎮 TRB TOPUP</div>
        <div class="user-balance">৳ 0</div>
    </header>

    <!-- Notice Bar -->
    <div class="notice">
        <span class="notice-tag">Notice</span>
        <marquee>নেট ৫ থেকে ৩ সেকেন্ডের মধ্যে ইন্সট্যান্ট টপআপ কমপ্লিট</marquee>
    </div>

    <div class="container">
        <!-- Banner/Slider Section -->
        <div class="banner-container" id="bannerBox">
            <p style="color: #666;">কোনো ব্যানার নেই</p>
        </div>

        <!-- Social Quick Links -->
        <div class="quick-links">
            <a href="#" class="link-box">💬 WhatsApp</a>
            <a href="#" class="link-box">✈️ Telegram</a>
            <a href="#" class="link-box">▶️ Tutorial</a>
        </div>

        <!-- Dynamic Products List -->
        <h3 class="section-title">টপ-আপ প্যাকেজ সমূহ</h3>
        <div class="products-grid" id="productsGrid">
            <p style="grid-column: span 2; text-align: center;">লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">🏠<br>Home</a>
        <a href="#" class="nav-item">💳<br>Add Fund</a>
        <a href="#" class="nav-item">📋<br>My Orders</a>
        <a href="product.html" class="nav-item">🛒<br>Topup</a>
    </div>

<script>
    // পেজ লোড হলে অ্যাডমিন প্যানেলের ডাটা অটোমেটিক শো করবে
    document.addEventListener('DOMContentLoaded', () => {
        loadHomeData();
    });

    function loadHomeData() {
        // ১. স্লাইডার লোড করা
        const sliders = JSON.parse(localStorage.getItem('admin_sliders') || '[]');
        const bannerBox = document.getElementById('bannerBox');

        if (sliders.length > 0) {
            // সর্বশেষ আপলোড করা ব্যানারটি দেখাবে
            bannerBox.innerHTML = `<img src="${sliders[sliders.length - 1].url}" alt="Banner">`;
        } else {
            bannerBox.innerHTML = `<p style="color: #888;">এডমিন প্যানেল থেকে স্লাইডার দিন</p>`;
        }

        // ২. প্রোডাক্ট লিস্ট লোড করা
        const products = JSON.parse(localStorage.getItem('admin_products') || '[]');
        const productsGrid = document.getElementById('productsGrid');

        if (products.length > 0) {
            productsGrid.innerHTML = products.map(item => `
                <div class="product-card">
                    <h4>${item.title}</h4>
                    <p>৳ ${item.price}</p>
                    <a href="product.html" class="buy-btn">Top Up</a>
                </div>
            `).join('');
        } else {
            productsGrid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: #888;">এডমিন প্যানেল থেকে কোনো প্রোডাক্ট দেওয়া হয়নি!</p>`;
        }
    }
</script>

</body>
</html>
